# In-cluster OpenJev (Verdict / CPU) — System One compatible decision API.
# Casino Sentinel points TYPESAFE_BASE_URL here when OPENJEV_DEPLOY=incluster.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openjev
  namespace: casino-sentinel
  labels:
    app.kubernetes.io/part-of: casino-sentinel
    app: openjev
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: openjev
  namespace: casino-sentinel
  labels:
    app.kubernetes.io/part-of: casino-sentinel
    app: openjev
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/openjev/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: openjev:latest
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openjev
  namespace: casino-sentinel
  labels:
    app.kubernetes.io/part-of: casino-sentinel
    app: openjev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openjev
  template:
    metadata:
      labels:
        app: openjev
        app.kubernetes.io/part-of: casino-sentinel
    spec:
      serviceAccountName: casino-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openjev
          image: image-registry.openshift-image-registry.svc:5000/casino-sentinel/openjev:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OPENJEV_BACKEND
              value: verdict
            - name: OPENJEV_HOST
              value: "0.0.0.0"
            - name: OPENJEV_PORT
              value: "8080"
            - name: HF_HOME
              value: /models/hf
          volumeMounts:
            - name: hf-cache
              mountPath: /models/hf
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openjev
  namespace: casino-sentinel
  labels:
    app: openjev
    app.kubernetes.io/part-of: casino-sentinel
spec:
  selector:
    app: openjev
  ports:
    - name: http
      port: 8080
      targetPort: 8080
