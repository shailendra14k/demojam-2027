# Topic names stay A's (casino.cdc.*). Retention / DLQ / heartbeat deltas from B.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: casino-cdc-players
  namespace: casino-sentinel
  labels:
    strimzi.io/cluster: sentinel-kafka
spec:
  topicName: casino.cdc.players
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
