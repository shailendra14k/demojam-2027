apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: sentinel-ui:latest
  runPolicy: Serial
