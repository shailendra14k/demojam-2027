apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-ui
  template:
    metadata:
      labels:
        app: sentinel-ui
    spec:
      containers:
        - name: ui
          image: image-registry.openshift-image-registry.svc:5000/casino-sentinel/sentinel-ui:latest
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
spec:
  selector:
    app: sentinel-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
spec:
  to:
    kind: Service
    name: sentinel-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
