apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-ui
  template:
    metadata:
      labels:
        app: sentinel-ui
    spec:
      serviceAccountName: casino-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: __SENTINEL_UI_IMAGE__
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
spec:
  selector:
    app: sentinel-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sentinel-ui
  namespace: casino-sentinel
  labels:
    app: sentinel-ui
  annotations:
    # From B: demo POSTs / API proxy must not hit the default ~30s edge cutoff.
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: sentinel-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Optional direct API route (from B routes delta); UI remains primary entry.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sentinel-api
  namespace: casino-sentinel
  labels:
    app: sentinel-api
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: sentinel-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
