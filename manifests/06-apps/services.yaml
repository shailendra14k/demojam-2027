# Microservice AML pipeline (from B architecture) with A naming (sentinel-*).
# Image: sentinel-python (SERVICE_NAME selects entrypoint).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-event-normalizer
  namespace: casino-sentinel
  labels:
    app: sentinel-event-normalizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-event-normalizer
  template:
    metadata:
      labels:
        app: sentinel-event-normalizer
    spec:
      serviceAccountName: casino-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: __SENTINEL_PYTHON_IMAGE__
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: event-normalizer
          envFrom:
            - configMapRef:
                name: casino-config
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
