---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: casino-sentinel
  labels:
    app: sentinel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      serviceAccountName: casino-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __SENTINEL_PYTHON_IMAGE__
          imagePullPolicy: Always
          # Empty SERVICE_NAME → backend uvicorn (B UI API) on 8080
          command: ["sh", "-c", "python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: casino-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: casino-sentinel
  labels:
    app: sentinel-api
spec:
  selector:
    app: sentinel-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-simulator
  namespace: casino-sentinel
  labels:
    app: sentinel-simulator
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sentinel-simulator
  template:
    metadata:
      labels:
        app: sentinel-simulator
    spec:
      serviceAccountName: casino-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: __SENTINEL_PYTHON_IMAGE__
          command: ["python", "-m", "sentinel.simulator"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: casino-db
                  key: database-url
            - name: SIMULATOR_CONFIG_DIR
              value: /etc/casino-config
            - name: SIMULATOR_INTERVAL_SEC
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: SIMULATOR_INTERVAL_SEC
            - name: SIMULATOR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: SIMULATOR_ENABLED
          volumeMounts:
            - name: casino-config
              mountPath: /etc/casino-config
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: casino-config
          configMap:
            name: casino-config
            items:
              - key: SIMULATOR_INTERVAL_SEC
                path: SIMULATOR_INTERVAL_SEC
              - key: SIMULATOR_ENABLED
                path: SIMULATOR_ENABLED
